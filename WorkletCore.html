<script>
class RavenOscillator extends AudioWorkletProcessor {
  static get parameterDescriptors() {
    return [
      {
        name: "frequency",
        defaultValue: 440,
        minValue: 20,
        maxValue: 12000
      },
      {
        name: "amplitude",
        defaultValue: 0.3,
        minValue: 0,
        maxValue: 1
      }
    ];
  }

  constructor() {
    super();
    this.phase = 0;
  }

  process(inputs, outputs, parameters) {
    const output = outputs[0];

    const frequencies = parameters.frequency;
    const amplitudes = parameters.amplitude;

    for (const channel of output) {
      for (let i = 0; i < channel.length; i++) {
        const frequency =
          frequencies.length > 1
            ? frequencies[i]
            : frequencies[0];

        const amplitude =
          amplitudes.length > 1
            ? amplitudes[i]
            : amplitudes[0];

        channel[i] = Math.sin(this.phase) * amplitude;

        this.phase +=
          (2 * Math.PI * frequency) / sampleRate;

        if (this.phase >= 2 * Math.PI) {
          this.phase -= 2 * Math.PI;
        }
      }
    }

    return true;
  }
}

registerProcessor("raven-oscillator", RavenOscillator);
</script>
